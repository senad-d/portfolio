<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Senad | DevOps Portfolio</title>
  <desc id="desc">Terminal session showing senad@cloud running whoami, terraform apply and a production deploy with a green pipeline.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030409" />
      <stop offset="1" stop-color="#070b16" />
    </linearGradient>
    <linearGradient id="card" x1="600" y1="72" x2="600" y2="558" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111820" />
      <stop offset="1" stop-color="#0d141c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <g id="chev" fill="none" stroke="#7ee787" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1 L9.5 9.5 L1 18" />
    </g>
    <g id="check" fill="none" stroke="#7ee787" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 9.5 L6.5 15.5 L16 2" />
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#page)" />

  <g stroke="#212e3f" stroke-width="1" opacity="0.8">
    <path d="M0 105H1200" />
    <path d="M0 210H1200" />
    <path d="M0 315H1200" />
    <path d="M0 420H1200" />
    <path d="M0 525H1200" />
    <path d="M110 0V630" />
    <path d="M220 0V630" />
    <path d="M330 0V630" />
    <path d="M440 0V630" />
    <path d="M550 0V630" />
    <path d="M660 0V630" />
    <path d="M770 0V630" />
    <path d="M880 0V630" />
    <path d="M990 0V630" />
    <path d="M1100 0V630" />
  </g>

  <g fill="#9da9b8" opacity="0.35">
    <circle cx="442" cy="38" r="2" />
    <circle cx="1148" cy="96" r="1.6" />
    <circle cx="52" cy="462" r="1.8" />
    <circle cx="452" cy="592" r="2" />
    <circle cx="1112" cy="588" r="1.6" />
    <circle cx="228" cy="612" r="1.5" />
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="72" width="1072" height="486" rx="18" fill="url(#card)" stroke="#1e2937" stroke-width="1.5" />
  </g>
  <path d="M64 138H1136" stroke="#1e2937" stroke-width="1.5" />

  <g>
    <circle cx="106" cy="105" r="10.5" fill="#ff5f57" />
    <circle cx="144" cy="105" r="10.5" fill="#febc2e" />
    <circle cx="182" cy="105" r="10.5" fill="#28c840" />
  </g>
  <text x="232" y="114" fill="#9da9b8" font-size="25" letter-spacing="1" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">senad@cloud: ~/portfolio</text>

  <g font-size="27" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <use href="#chev" x="104" y="181" />
    <text x="140" y="200" fill="#e6edf3" font-weight="600">whoami</text>

    <text x="104" y="251" fill="#9da9b8">senad — devops &amp; cloud engineer · aws certified</text>

    <use href="#chev" x="104" y="283" />
    <text x="140" y="302" fill="#e6edf3" font-weight="600">terraform apply -auto-approve</text>

    <text x="104" y="353" fill="#7ee787">Apply complete! Resources: 128 added, 0 changed, 0 destroyed.</text>

    <use href="#chev" x="104" y="385" />
    <text x="140" y="404" fill="#e6edf3" font-weight="600">./deploy.sh --env production</text>

    <use href="#check" x="104" y="437" />
    <text x="140" y="455" fill="#7ee787">pipeline green · zero-downtime release</text>

    <use href="#chev" x="104" y="487" />
    <rect x="140" y="482" width="16" height="30" fill="#7ee787" />
  </g>
</svg>
